version: '3.8'

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      JAVA_OPTS: -Dhudson.model.DirectoryBrowserSupport.CSP=default-src 'self'
    networks:
      - datashield

volumes:
  jenkins_home:

networks:
  datashield:
    driver: bridge
