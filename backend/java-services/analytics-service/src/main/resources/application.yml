spring:
  application:
    name: analytics-service
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/datasheild?currentSchema=analytics
    username: datasheild
    password: datasheild_dev_pwd
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: analytics-group
      auto-offset-reset: earliest

server:
  port: 8017
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    io.datasheild: DEBUG
  pattern:
    console: "%d{ISO8601} %-5level [%thread] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: false
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
