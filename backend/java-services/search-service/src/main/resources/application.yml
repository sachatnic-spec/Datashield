spring:
  application:
    name: search-service
  datasource:
    url: jdbc:postgresql://localhost:5432/datasheild?currentSchema=search
    username: datasheild
    password: datasheild_dev_pwd
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: search
        jdbc:
          time_zone: UTC
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: search-service-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"
  task:
    scheduling:
      pool:
        size: 2
  cloud:
    discovery:
      enabled: true

server:
  port: 8014

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: search-service

logging:
  level:
    root: INFO
    com.datasheild.searchservice: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

search:
  retention-days: 90
  kafka:
    enabled: true
    audit-topic: audit.entry.created
  elasticsearch:
    enabled: true
    url: http://localhost:9200
    connect-timeout-millis: 1000
    socket-timeout-millis: 2000
  maintenance:
    cleanup-cron: "0 0 2 * * *"
    rollover-cron: "0 0 0 * * *"

# Eureka Configuration
eureka:
  instance:
    hostname: localhost
    prefer-ip-address: false
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
