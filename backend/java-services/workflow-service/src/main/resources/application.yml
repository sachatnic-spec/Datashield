spring:
  application:
    name: workflow-service
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: jdbc:postgresql://localhost:5432/datasheild
    username: datasheild
    password: datasheild_dev_pwd
    hikari:
      maximum-pool-size: 20
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      retries: 3
  cloud:
    discovery:
      enabled: true

server:
  port: 8011
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    io.datasheild: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

# Eureka Configuration
eureka:
  instance:
    hostname: localhost
    prefer-ip-address: false
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
