spring:
  application:
    name: dpbi-service
  datasource:
    url: jdbc:postgresql://localhost:5432/datasheild?currentSchema=dpbi
    username: datasheild
    password: datasheild_dev_pwd
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: dpbi
  sql:
    init:
      mode: always
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      retries: 3
      transaction-id-prefix: dpbi-tx-
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: dpbi-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        isolation.level: read_committed
        spring.json.trusted.packages: "*"
  task:
    scheduling:
      pool:
        size: 4
  cloud:
    discovery:
      enabled: true
server:
  port: 8005
logging:
  level:
    root: INFO
    com.datasheild: INFO
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

dpbi:
  api:
    base-url: http://localhost:8080/api/dpbi/submissions
  s3:
    bucket-name: datasheild-dpbi-documents

# Eureka Configuration
eureka:
  instance:
    hostname: localhost
    prefer-ip-address: false
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
