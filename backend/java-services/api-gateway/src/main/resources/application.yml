server:
  port: 8080
  servlet:
    context-path: /

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: false
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 5s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
    instances:
      authServiceCB:
        baseConfig: default
      grievanceServiceCB:
        baseConfig: default
      consentServiceCB:
        baseConfig: default
      breachServiceCB:
        baseConfig: default
      auditServiceCB:
        baseConfig: default
      policyServiceCB:
        baseConfig: default
      rightsServiceCB:
        baseConfig: default
      tenantServiceCB:
        baseConfig: default
      notificationServiceCB:
        baseConfig: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
