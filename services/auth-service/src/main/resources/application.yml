spring:
  application:
    name: auth-service
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  datasource:
    url: jdbc:postgresql://localhost:5432/datasheild
    username: datasheild
    password: datasheild_dev_pwd
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  redis:
    host: localhost
    port: 6379
    password: datasheild_dev_pwd
    timeout: 60000
    jedis:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8001
  servlet:
    context-path: /
  error:
    include-message: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    root: INFO
    io.datasheild: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Application Configuration
datasheild:
  auth:
    jwt:
      secret: ${JWT_SECRET:dev-secret-key-change-in-production-32-chars-min}
      expiration: 3600000 # 1 hour
      refresh-expiration: 604800000 # 7 days
    mfa:
      enabled: true
      totp-window: 1
    tenancy:
      schema-per-tenant: true
