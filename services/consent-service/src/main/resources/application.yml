spring:
  application:
    name: consent-service
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQL10Dialect
      hibernate.default_schema: consent
  datasource:
    url: jdbc:postgresql://localhost:5432/datasheild?currentSchema=consent
    username: datasheild
    password: datasheild_dev_pwd
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
  redis:
    host: localhost
    port: 6379
    password: datasheild_dev_pwd
    timeout: 60000
  kafka:
    bootstrap-servers: localhost:29092
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      bootstrap-servers: localhost:29092
      group-id: consent-service-consumer
  cache:
    type: redis
    redis:
      time-to-live: 600000
  task:
    scheduling:
      pool:
        size: 5
      thread-name-prefix: consent-scheduler-

server:
  port: 8002
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    io.datasheild: DEBUG
    org.hibernate.SQL: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: consent-service

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs

