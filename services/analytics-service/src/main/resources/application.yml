spring:
  application:
    name: analytics-service
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/datasheild_analytics
    username: datasheild_admin
    password: datasheild_secure_123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: analytics-group
      auto-offset-reset: earliest

server:
  port: 8013
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    io.datasheild: DEBUG
  pattern:
    console: "%d{ISO8601} %-5level [%thread] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
