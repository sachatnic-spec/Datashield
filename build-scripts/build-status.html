<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DataShield Build Dashboard</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f4f4;margin:20px}
h1{color:#333}
.card{background:#fff;padding:15px;border-radius:8px;margin-bottom:15px;box-shadow:0 2px 5px rgba(0,0,0,.15)}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;border:1px solid #ddd}
th{background:#222;color:#fff}
.pending{background:#e0e0e0}
.running{background:#fff3cd}
.success{background:#d4edda}
.failed{background:#f8d7da}
.progress{width:100%;background:#ddd;border-radius:6px}
.bar{height:22px;width:0%;background:#28a745;color:#fff;text-align:center}
</style>
</head>
<body>
<h1>DataShield India - Build Dashboard</h1>

<div class="card">
<h3>Overall Progress</h3>
<div class="progress"><div class="bar">0%</div></div>
<p>Total Services: <b id="total">0</b></p>
<p>Success: <b id="success">0</b> |
Failed: <b id="failed">0</b> |
Running: <b id="running">0</b> |
Pending: <b id="pending">0</b></p>
<p>Current Service: <b id="current">Waiting...</b></p>
<p>Build Started: <span id="start">-</span></p>
<p>Elapsed: <span id="elapsed">-</span></p>
</div>

<div class="card">
<h3>Services</h3>
<table>
<thead><tr><th>Service</th><th>Status</th><th>Duration</th><th>Log</th></tr></thead>
<tbody id="services">
<!-- build-java.bat will append rows here -->
</tbody>
</table>
</div>

<div class="card">
<h3>Latest Build Summary</h3>
<pre id="summary">Waiting for build...</pre>
</div>

</body>
</html>
